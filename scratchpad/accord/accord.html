<!-- ═══ L'ACCORD PARFAIT : upsell des fiches produits (27/11, v2 compacte) — inséré dans product.html par scratchpad/accord/insert.py ═══ -->
<style>
/* Placé sous « Avis clients » ; sur ordinateur, ligne pleine largeur sous la grille avis | FAQ */
@media(min-width:1025px){ .pd-duo > #pdAccord{grid-column:1/-1;order:5} .pd-duo > #pdJournal{order:6} }
.acc{position:relative;padding:34px 0 30px;background:radial-gradient(900px 300px at 50% -80px,rgba(232,203,160,.32),transparent 70%),linear-gradient(180deg,#fffdfb,#f8ece8);border-top:1px solid rgba(201,164,106,.25)}
.acc-in{max-width:1480px;margin:0 auto;padding:0 16px}
.acc-head{text-align:center;margin:0 auto 18px;max-width:640px}
.acc-k{display:inline-flex;align-items:center;gap:10px;font:600 10px var(--font-b);letter-spacing:.3em;text-transform:uppercase;color:#a8792f;margin-bottom:8px}
.acc-k::before,.acc-k::after{content:"";width:24px;height:1px;background:linear-gradient(90deg,transparent,#c9a46a)}
.acc-k::after{transform:scaleX(-1)}
.acc-h{font-family:var(--font-d);font-weight:400;font-size:clamp(22px,2.6vw,34px);line-height:1.12;color:#2a0f18}
.acc-h em{font-style:italic;background:linear-gradient(100deg,#b84460,#d98a9c 50%,#b88a5a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.acc-sub{margin-top:8px;font-size:12.5px;line-height:1.5;color:#7a666b}
.acc-list{display:grid;gap:10px}
.acc-card{position:relative;display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border-radius:20px;background:#fff;border:1px solid rgba(42,15,24,.07);box-shadow:0 12px 26px -20px rgba(90,30,50,.4);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.acc-card:hover{transform:translateY(-2px);box-shadow:0 18px 32px -20px rgba(90,30,50,.5)}
.acc-pic{position:relative;display:block;width:88px;height:110px;border-radius:999px 999px 14px 14px;overflow:hidden;background:var(--g,#f4ecef)}
.acc-pic img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.acc-card:hover .acc-pic img{transform:scale(1.06)}
.acc-sig{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);white-space:nowrap;padding:3px 7px;border-radius:999px;background:#2a0f18;color:#f1d9ae;font:600 7.5px var(--font-b);letter-spacing:.14em;text-transform:uppercase}
.acc-b{min-width:0}
.acc-step{font:600 9.5px var(--font-b);letter-spacing:.14em;text-transform:uppercase;color:#a8792f}
.acc-n{margin-top:3px;font-family:var(--font-d);font-size:16px;line-height:1.18;color:#1c0a10;text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acc-why{margin-top:2px;font-size:11.5px;line-height:1.4;color:#8a7479;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-row{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.acc-price{white-space:nowrap;line-height:1.1}
.acc-price b{font-family:var(--font-d);font-weight:400;font-size:18px;color:#1c0a10}
.acc-price s{font-size:11px;color:#a6959a;margin-left:4px}
.acc-price em{display:block;font-style:normal;font-size:10px;font-weight:700;color:#b84460;margin-top:2px}
.acc-btn{position:relative;overflow:hidden;flex:none;padding:10px 14px;border:0;border-radius:999px;cursor:pointer;background:#2a0f18;color:#f6e3c2;font:700 10px var(--font-b);letter-spacing:.12em;text-transform:uppercase;transition:transform .2s,background .3s}
.acc-btn:hover{transform:translateY(-1px);background:#7a2443}
.acc-btn.duo{background:linear-gradient(135deg,#f6e3c2,#d9b27a 55%,#c9a46a);color:#2a0f18}
.acc-btn.duo::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);animation:accSh 3.6s ease-in-out infinite}
@keyframes accSh{0%,55%{left:-40%}100%{left:140%}}
.acc-btn.done{background:#2a7a4b;color:#fff}
.acc-note{margin-top:12px;text-align:center;font-size:11.5px;color:#8a7479}
.acc-note b{color:#7a2443}
@media(max-width:699px){
  .acc{padding:24px 0 20px}
  .acc-head{margin-bottom:12px}
  .acc-k{margin-bottom:4px;font-size:9px}
  .acc-h{font-size:19px}
  .acc-sub,.acc-why,.acc-sig{display:none}
  .acc-list{gap:8px}
  .acc-card{grid-template-columns:58px minmax(0,1fr);gap:10px;padding:7px 10px 7px 7px;border-radius:16px}
  .acc-pic{width:58px;height:72px;border-radius:999px 999px 10px 10px}
  .acc-step{font-size:8.5px;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acc-n{font-size:14px;-webkit-line-clamp:1;margin-top:1px}
  .acc-row{margin-top:4px}
  .acc-price b{font-size:16px}
  .acc-price s{font-size:10px}
  .acc-price em{font-size:9.5px;margin-top:1px}
  .acc-btn{padding:8px 12px;font-size:9.5px}
  .acc-note{margin-top:10px;font-size:10.5px}
}
@media(min-width:700px){ .acc-list{grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:16px} }
@media(min-width:1025px){
  .acc{padding:56px 0 50px}
  .acc-in{padding:0 40px}
  .acc-head{margin-bottom:26px}
  .acc-card{grid-template-columns:104px minmax(0,1fr);gap:16px;padding:12px}
  .acc-pic{width:104px;height:130px}
  .acc-n{font-size:18px}
}
@media(prefers-reduced-motion:reduce){.acc-btn.duo::after{animation:none}}
</style>
<script>
/* L'Accord parfait (v2) : 3 soins complémentaires en cartes compactes, sous les avis.
   Si un vrai duo existe dans products.json (formule dont product_images = ce soin + le partenaire), la carte propose ce duo à son prix ;
   sinon elle ajoute le partenaire seul. Aucune remise inventée. */
(function(){
  const KIND = [['peeling','Exfoliant',0],['brume-visage','Brume',7],['patchs','Patchs',4],['contour','Contour des yeux',5],
    ['serum-cuir','Sérum cuir chevelu',24],['serum','Sérum',2],['creme','Crème',6],['gommage','Gommage',20],['apres-shampoing','Après-shampoing',22],
    ['shampoing-sec','Shampoing sec',27],['shampoing','Shampoing',21],['masque','Masque',23],['soin-hydratant','Soin sans rinçage',25],
    ['brume-capillaire','Brume capillaire',26],['huile','Huile',28]];
  const kind = id => { const t = KIND.find(x => id.includes(x[0])) || ['', 'Soin', 9]; return { label:t[1], rank:t[2], key:t[0], hair:t[2] >= 20 }; };
  const GBG = { 'o·boost':'#dcebfb', 'e·boost':'#dcebfb', 'o·care':'#efe4f7', 'o·hydraline':'#fbefc6', 'hydraline':'#fbefc6', 'o·répare':'#f9e3e8' };
  const fmt = n => n.toFixed(2).replace('.', ',') + ' €';
  const pct = (ref, price) => ref > price ? Math.floor((1 - price / ref) * 100 + 1e-9) : 0;
  const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const imgId = src => String(src || '').replace(/^cart-/, '').replace(/(-v\d+)?\.jpg.*$/, '');
  const solo = p => p.bundles && p.bundles[0];
  const ok = p => p && !p.virtual && !['box','cadeau'].includes(p.category) && solo(p) && solo(p).price_raw > 0;
  const firstBenefit = p => { const b = (p.benefits || [])[0]; return b ? (typeof b === 'string' ? b : b.title) : ''; };

  window.renderAccord = function(cur, all){
    const host = document.getElementById('pdAccord');
    if (!host || !ok(cur)) return;
    const by = {}; all.forEach(p => by[p.id] = p);
    const ck = kind(cur.id);

    /* Partenaires : soins des duos/rituels de cette fiche, puis fiches qui proposent ce soin, puis étapes manquantes du même univers */
    const picks = [], add = (id, sig) => { const p = by[id]; if (ok(p) && id !== cur.id && !picks.find(x => x.p.id === id)) picks.push({ p, sig }); };
    (cur.bundles || []).slice(1).forEach(b => (b.product_images || []).forEach(s => add(imgId(s), true)));
    all.forEach(p => (p.bundles || []).slice(1).forEach(b => { const ids = (b.product_images || []).map(imgId); if (ids.includes(cur.id)) ids.forEach(i => add(i, true)); }));
    const used = () => new Set([ck.key, ...picks.map(x => kind(x.p.id).key)]);
    const pool = all.filter(p => ok(p) && p.id !== cur.id && kind(p.id).hair === ck.hair)
      .sort((a, b) => ((a.gamme === cur.gamme ? 0 : 1) - (b.gamme === cur.gamme ? 0 : 1)) || ((a.bestseller_rank || 99) - (b.bestseller_rank || 99)));
    pool.forEach(p => { if (picks.length < 3 && !used().has(kind(p.id).key)) add(p.id, false); });
    pool.forEach(p => { if (picks.length < 3) add(p.id, false); });
    const list = picks.slice(0, 3);
    if (!list.length) return;

    /* Vrai duo (2 soins) du catalogue pour le couple soin affiché + partenaire : le moins cher s'il y en a plusieurs */
    const duoFor = pid => {
      const key = [cur.id, pid].sort().join('|'); let best = null;
      all.forEach(p => (p.bundles || []).slice(1).forEach(b => {
        const ids = (b.product_images || []).map(imgId);
        if (ids.length === 2 && ids.slice().sort().join('|') === key && b.price_raw > 0 && (!best || b.price_raw < best.price))
          best = { id: b.add_id || (p.id + '--' + b.id), name: b.name, price: b.price_raw, ref: b.original_price_raw || 0 };
      }));
      return best;
    };

    const card = ({ p, sig }) => {
      const s = solo(p), d = duoFor(p.id), k = kind(p.id);
      const rel = (k.rank < ck.rank ? 'Avant' : 'Après') + ' votre ' + ck.label.toLowerCase();
      const off = d ? pct(d.ref, d.price) : pct(s.original_price_raw || 0, s.price_raw);
      const price = d ? `<span class="acc-price"><b>${fmt(d.price)}</b>${d.ref > d.price ? `<s>${fmt(d.ref)}</s>` : ''}<em>${esc(d.name)}${off ? ' · −' + off + ' %' : ''}</em></span>`
                      : `<span class="acc-price"><b>${esc(s.price)}</b>${s.original_price ? `<s>${esc(s.original_price)}</s>` : ''}${off ? `<em>−${off} %</em>` : ''}</span>`;
      return `<div class="acc-card">
        <a class="acc-pic" href="/produits/${p.id}" style="--g:${GBG[p.gamme] || '#f4ecef'}"><img src="bar-${p.id}-hd.jpg?v=4" alt="${esc(p.name + ' ' + (p.name_line2 || ''))}" loading="lazy" decoding="async">${sig ? '<span class="acc-sig">✦ Signature</span>' : ''}</a>
        <div class="acc-b"><p class="acc-step">${esc(k.label)} · ${esc(rel)}</p>
          <a class="acc-n" href="/produits/${p.id}">${esc(p.name)} ${esc(p.name_line2 || '')}</a>
          <p class="acc-why">${esc(firstBenefit(p))}</p>
          <div class="acc-row">${price}<button type="button" class="acc-btn${d ? ' duo' : ''}" data-acc="${p.id}" data-offer="${d ? esc(d.id) : ''}">${d ? 'Le duo' : '+ Ajouter'}</button></div>
        </div></div>`;
    };

    host.innerHTML = `<section class="acc" aria-labelledby="accH"><div class="acc-in">
      <div class="acc-head"><p class="acc-k">L'Accord parfait</p>
        <h2 class="acc-h" id="accH">Seul, il est remarquable. <em>Accompagné, il devient un rituel.</em></h2>
        <p class="acc-sub">Les soins qui prolongent l'effet de votre ${esc(cur.name)}, choisis par Onaé.</p></div>
      <div class="acc-list" style="--n:${list.length}">${list.map(card).join('')}</div>
      <p class="acc-note">Routine de 3 soins au choix : <b>−20 % minimum</b> au <a href="/bar-a-routines.html" style="color:inherit">Bar à routines</a> · Livraison offerte dès 49 €</p>
    </div></section>`;

    host.addEventListener('click', e => {
      const b = e.target.closest('[data-acc]'); if (!b || !window.OnaeCart) return;
      const C = OnaeCart, offer = b.dataset.offer;
      let added;
      if (offer) {
        /* Duo : le soin déjà présent seul dans le panier est remplacé par le duo (pas de doublon) */
        [cur.id, b.dataset.acc].forEach(i => { const l = C.lines().find(x => x.id === i); if (l) C.set(i, l.qty - 1); });
        added = C.addWithFeedback(offer);
      } else added = C.addWithFeedback(b.dataset.acc);
      if (added !== false) { const t = b.textContent; b.textContent = '✓ Ajouté'; b.classList.add('done'); setTimeout(() => { b.textContent = t; b.classList.remove('done'); }, 2200); }
    });
  };
})();
</script>
<!-- /ACCORD -->
