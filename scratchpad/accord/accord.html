<!-- ═══ L'ACCORD PARFAIT : upsell des fiches produits (27/11) — inséré dans product.html par scratchpad/accord/insert.py ═══ -->
<style>
.acc{position:relative;isolation:isolate;overflow:hidden;margin:8px 0 0;padding:64px 0 56px;background:
  radial-gradient(1200px 420px at 50% -120px,rgba(232,203,160,.38),transparent 70%),
  radial-gradient(700px 500px at 100% 100%,rgba(201,85,110,.10),transparent 70%),
  linear-gradient(180deg,#fffdfb 0%,#fbf3ee 46%,#f6e7e2 100%)}
.acc::before{content:"";position:absolute;left:50%;top:0;width:min(560px,70%);height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#c9a46a,transparent)}
.acc-dust{position:absolute;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(1.2px 1.2px at 12% 22%,#d9b77f 50%,transparent 51%),radial-gradient(1px 1px at 78% 14%,#d9b77f 50%,transparent 51%),radial-gradient(1.4px 1.4px at 64% 70%,#e6c99a 50%,transparent 51%),radial-gradient(1px 1px at 30% 82%,#d9b77f 50%,transparent 51%),radial-gradient(1.2px 1.2px at 90% 56%,#e6c99a 50%,transparent 51%),radial-gradient(1px 1px at 46% 36%,#d9b77f 50%,transparent 51%);animation:accTw 7s ease-in-out infinite alternate}
@keyframes accTw{from{opacity:.25}to{opacity:.7}}
.acc-in{position:relative;max-width:1480px;margin:0 auto;padding:0 20px}
.acc-head{text-align:center;max-width:760px;margin:0 auto 34px}
.acc-k{display:inline-flex;align-items:center;gap:12px;font:600 10.5px var(--font-b);letter-spacing:.32em;text-transform:uppercase;color:#a8792f;margin-bottom:16px}
.acc-k::before,.acc-k::after{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,#c9a46a)}
.acc-k::after{transform:scaleX(-1)}
.acc-h{font-family:var(--font-d);font-weight:400;font-size:clamp(30px,4.2vw,54px);line-height:1.06;color:#2a0f18;letter-spacing:-.01em}
.acc-h em{font-style:italic;color:#c9556e;background:linear-gradient(100deg,#b84460,#d98a9c 45%,#b88a5a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.acc-sub{margin:16px auto 0;max-width:560px;font-size:14.5px;line-height:1.65;color:#6b5a5e}
.acc-pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px}
.acc-pills span{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(201,164,106,.35);font-size:11.5px;color:#5b3a44;backdrop-filter:blur(6px)}
.acc-pills i{width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,#f1d9ae,#b88a5a)}

/* Grille : votre soin + partenaires */
.acc-grid{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:22px 20px 18px;margin:0 -20px;scrollbar-width:none}
.acc-grid::-webkit-scrollbar{display:none}
.acc-card{position:relative;flex:0 0 74%;scroll-snap-align:center;display:flex;flex-direction:column;background:#fff;border-radius:26px;padding:12px 12px 18px;border:1px solid rgba(42,15,24,.07);box-shadow:0 18px 40px -24px rgba(90,30,50,.35);transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s,border-color .4s;cursor:pointer;text-align:left;font:inherit;color:inherit}
.acc-card:hover{transform:translateY(-4px);box-shadow:0 28px 50px -24px rgba(90,30,50,.45)}
.acc-arch{position:relative;aspect-ratio:4/5;border-radius:999px 999px 18px 18px;overflow:hidden;background:var(--g,#f4ecef)}
.acc-arch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.acc-card:hover .acc-arch img{transform:scale(1.045)}
.acc-arch::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);pointer-events:none}
.acc-arch .acc-shine{position:absolute;inset:-40% auto -40% -60%;width:40%;transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);opacity:0;pointer-events:none}
.acc-card.on .acc-shine{animation:accShine 1.1s ease-out}
@keyframes accShine{0%{left:-60%;opacity:1}100%{left:130%;opacity:0}}
.acc-step{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);white-space:nowrap;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);font:600 10px var(--font-b);letter-spacing:.14em;text-transform:uppercase;color:#5b3a44}
.acc-tick{position:absolute;z-index:2;top:22px;right:22px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);border:1.5px solid rgba(42,15,24,.14);display:grid;place-items:center;transition:all .35s cubic-bezier(.2,.8,.2,1)}
.acc-tick svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;opacity:0;transform:scale(.4);transition:all .35s cubic-bezier(.2,.8,.2,1)}
.acc-card.on .acc-tick{background:linear-gradient(135deg,#d06a82,#a83a56);border-color:transparent;box-shadow:0 6px 16px -4px rgba(168,58,86,.6)}
.acc-card.on .acc-tick svg{opacity:1;transform:scale(1)}
.acc-card.on{border-color:transparent;box-shadow:0 0 0 2px #d9b27a,0 26px 50px -22px rgba(168,58,86,.5)}
.acc-curated{position:absolute;z-index:2;top:-12px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:7px 14px;box-shadow:0 8px 18px -8px rgba(42,15,24,.6);border-radius:999px;background:#2a0f18;color:#f1d9ae;font:600 9.5px var(--font-b);letter-spacing:.16em;text-transform:uppercase}
.acc-body{padding:16px 6px 0;display:flex;flex-direction:column;flex:1}
.acc-why{font-family:var(--font-d);font-style:italic;font-size:15.5px;line-height:1.3;color:#a83a56;margin-bottom:6px}
.acc-n{font-family:var(--font-d);font-size:20px;line-height:1.15;color:#1c0a10}
.acc-n small{display:block;font-family:var(--font-b);font-size:12.5px;color:#8a7479;margin-top:3px;line-height:1.35}
.acc-syn{margin-top:10px;font-size:12.8px;line-height:1.55;color:#5f5054}
.acc-foot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;align-items:stretch;gap:12px}
.acc-price{white-space:nowrap}
.acc-price b{font-family:var(--font-d);font-weight:400;font-size:22px;color:#1c0a10}
.acc-price s{font-size:12px;color:#a6959a;margin-left:6px}
.acc-price em{font-style:normal;font-size:10.5px;font-weight:700;color:#b84460;background:#fbe9ee;border-radius:999px;padding:3px 7px;margin-left:6px}
.acc-btn{display:block;text-align:center;padding:13px 14px;border-radius:999px;border:1px solid rgba(42,15,24,.18);font:600 10.5px var(--font-b);letter-spacing:.12em;text-transform:uppercase;color:#2a0f18;background:#fff;transition:all .3s}
.acc-card.on .acc-btn{background:#2a0f18;color:#f1d9ae;border-color:#2a0f18}

/* Carte « votre soin » : velours */
.acc-me{cursor:default;background:linear-gradient(165deg,#3a1220 0%,#1d0910 100%);border:0;box-shadow:0 26px 50px -24px rgba(42,15,24,.7)}
.acc-me:hover{transform:none}
.acc-me .acc-curated{background:linear-gradient(135deg,#f6e3c2,#c9a46a);color:#2a0f18}
.acc-c2{background:#fff;color:#7a5560;border:1px solid rgba(201,164,106,.45)}
.acc-me .acc-arch{box-shadow:0 0 0 1px rgba(241,217,174,.35)}
.acc-me .acc-n{color:#fff}.acc-me .acc-n small{color:rgba(255,255,255,.6)}
.acc-me .acc-why{color:#f1d9ae}
.acc-me .acc-syn{color:rgba(255,255,255,.72)}
.acc-me .acc-price b{color:#fff}.acc-me .acc-price s{color:rgba(255,255,255,.45)}
.acc-me .acc-price em{background:rgba(241,217,174,.16);color:#f1d9ae}
.acc-me .acc-btn{background:transparent;border-color:rgba(241,217,174,.4);color:#f1d9ae}
.acc-plus{display:none}

/* Écrin récapitulatif */
.acc-sum{position:relative;margin-top:22px;border-radius:30px;padding:24px 20px;background:radial-gradient(600px 240px at 0% 0%,rgba(201,85,110,.35),transparent 70%),radial-gradient(500px 260px at 100% 100%,rgba(184,138,90,.28),transparent 70%),linear-gradient(140deg,#341019,#170609);color:#fff;overflow:hidden;box-shadow:0 30px 60px -30px rgba(42,15,24,.8)}
.acc-sum::before{content:"";position:absolute;inset:7px;border-radius:24px;border:1px solid rgba(241,217,174,.22);pointer-events:none}
.acc-sum-row{position:relative;display:flex;flex-direction:column;gap:18px}
.acc-trail{display:flex;align-items:center}
.acc-trail .t{position:relative;width:58px;height:72px;border-radius:999px 999px 12px 12px;overflow:hidden;background:var(--g,#f4ecef);box-shadow:0 0 0 2px #2a0f18,0 0 0 3px rgba(241,217,174,.5);animation:accPop .55s cubic-bezier(.2,1.4,.4,1) both}
.acc-trail .t img{width:100%;height:100%;object-fit:cover}
.acc-trail .p{margin:0 6px;color:#e6c99a;font-family:var(--font-d);font-size:22px}
@keyframes accPop{from{transform:scale(.4) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.acc-lbl{font:600 10px var(--font-b);letter-spacing:.24em;text-transform:uppercase;color:#e6c99a}
.acc-name{font-family:var(--font-d);font-size:24px;line-height:1.15;margin-top:5px}
.acc-note{font-size:12.5px;color:rgba(255,255,255,.66);margin-top:6px;line-height:1.5}
.acc-tot{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px}
.acc-tot b{font-family:var(--font-d);font-weight:400;font-size:44px;line-height:1;background:linear-gradient(180deg,#fff,#f1d9ae);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.acc-tot s{font-size:15px;color:rgba(255,255,255,.45)}
.acc-save{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:linear-gradient(135deg,#f6e3c2,#c9a46a);color:#2a0f18;font:700 11.5px var(--font-b);letter-spacing:.04em}
.acc-perks{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:11.5px;color:rgba(255,255,255,.72)}
.acc-perks span::before{content:"✦ ";color:#e6c99a}
.acc-cta{position:relative;overflow:hidden;width:100%;padding:19px 26px;border:0;border-radius:999px;cursor:pointer;background:linear-gradient(135deg,#f6e3c2 0%,#e0bf86 50%,#c9a46a 100%);color:#2a0f18;font:700 12.5px var(--font-b);letter-spacing:.16em;text-transform:uppercase;box-shadow:0 14px 30px -12px rgba(224,191,134,.7);transition:transform .25s}
.acc-cta:hover{transform:translateY(-2px)}
.acc-cta::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:accCta 3.6s ease-in-out infinite}
@keyframes accCta{0%,55%{left:-40%}100%{left:140%}}
.acc-cta.done{background:linear-gradient(135deg,#d7efe0,#8fcaa5)}
.acc-nudge{position:relative;margin-top:16px;padding:13px 16px;border-radius:16px;background:rgba(241,217,174,.1);border:1px dashed rgba(241,217,174,.4);font-size:12.8px;line-height:1.5;color:#f6e3c2}
.acc-nudge b{color:#fff}
.acc-nudge:empty{display:none}
.acc-legal{margin-top:12px;text-align:center;font-size:11px;color:#9b878c}

@media(max-width:1024px){
  .acc{padding:52px 0 44px}
  .acc-me{display:none}
  .acc-sl{display:none}
  .acc-step{font-size:9.5px;letter-spacing:.1em;max-width:88%;overflow:hidden;text-overflow:ellipsis}
  .acc-card{flex-basis:78%}
  .acc-pills{gap:6px}
  .acc-pills span{padding:6px 11px;font-size:10.5px}
}
@media(min-width:1025px){
  .acc{padding:96px 0 84px;margin-top:20px}
  .acc-in{padding:0 40px}
  .acc-head{margin-bottom:46px}
  .acc-grid{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:30px;overflow:visible;padding:14px 0 0;margin:0}
  .acc-card{padding:14px 14px 22px;border-radius:30px}
  .acc-plus{display:grid;place-items:center;position:absolute;top:38%;right:-29px;z-index:2;width:28px;height:28px;border-radius:50%;background:#fff;color:#a8792f;font:400 20px var(--font-d);box-shadow:0 6px 16px -6px rgba(90,30,50,.4)}
  .acc-card:last-child .acc-plus{display:none}
  .acc-n{font-size:22px}
  .acc-sum{margin-top:40px;padding:34px 44px;border-radius:36px}
  .acc-sum::before{border-radius:29px}
  .acc-sum-row{flex-direction:row;align-items:center;gap:40px}
  .acc-sum-row > div:nth-child(2){flex:1}
  .acc-cta{width:auto;min-width:340px;padding:22px 34px}
  .acc-trail .t{width:70px;height:88px}
  .acc-tot b{font-size:52px}
  .acc-name{font-size:28px}
}
@media(prefers-reduced-motion:reduce){.acc-dust,.acc-cta::after,.acc-card.on .acc-shine{animation:none}}
</style>
<script>
/* L'Accord parfait : propose 3 soins complémentaires au soin affiché et applique automatiquement le meilleur prix RÉEL :
   formule duo/rituel existante (products.json) si la combinaison existe, sinon −20 % du Bar à routines pour 3 soins,
   sinon prix des soins à l'unité. Aucune remise inventée. */
(function(){
  const KIND = [['peeling','Exfoliant',0],['brume-visage','Brume de finition',7],['patchs','Patchs regard',4],['contour','Contour des yeux',5],
    ['serum-cuir','Sérum cuir chevelu',24],['serum','Sérum',2],['creme','Crème',6],['gommage','Gommage',20],['apres-shampoing','Après-shampoing',22],
    ['shampoing-sec','Shampoing sec',27],['shampoing','Shampoing',21],['masque','Masque',23],['soin-hydratant','Soin sans rinçage',25],
    ['brume-capillaire','Brume capillaire',26],['huile','Huile',28]];
  const kind = id => { const t = KIND.find(x => id.includes(x[0])) || ['', 'Soin', 9]; return { label:t[1], rank:t[2], key:t[0], hair:t[2] >= 20 }; };
  const SYN = {
    'peeling':"1 à 2 soirs par semaine, il affine le grain de peau : vos soins s'étalent sur une peau plus nette et plus lumineuse.",
    'brume-visage':"En dernier geste, elle rafraîchit et parfait la routine : une peau confortable, fraîche toute la journée.",
    'patchs':"15 minutes de pause pour le regard : il paraît reposé, même après une nuit trop courte.",
    'contour':"La peau du contour de l'œil est la plus fine du visage : elle mérite son propre soin, pour un regard qui suit la même transformation.",
    'serum-cuir':"Il prend soin du cuir chevelu, là où tout commence : des cheveux qui paraissent plus forts et plus vivants.",
    'serum':"Appliqué avant, ce sérum concentré prépare la peau : chaque geste qui suit gagne en intensité.",
    'creme':"Elle vient sceller votre routine : la peau reste nourrie, confortable et visiblement plus lisse jusqu'au soir.",
    'gommage':"Une fois par semaine, il purifie le cuir chevelu : vos soins agissent sur une base nette et fraîche.",
    'apres-shampoing':"Juste après le lavage, il démêle et adoucit : des longueurs souples, faciles à coiffer.",
    'shampoing-sec':"Entre deux lavages, il redonne fraîcheur et volume en quelques secondes.",
    'shampoing':"La base de tout rituel capillaire : un lavage doux, pensé pour prolonger l'effet de vos soins.",
    'masque':"Une fois par semaine, un soin intensif qui gaine la fibre : brillance et douceur retrouvées.",
    'soin-hydratant':"Sans rinçage, il hydrate et définit : des cheveux souples et disciplinés toute la journée.",
    'brume-capillaire':"En finition, quelques pulvérisations suffisent : des cheveux lissés, brillants et protégés.",
    'huile':"Quelques gouttes en finition ou en bain d'huile : force et brillance, du cuir chevelu aux pointes."
  };
  const GBG = { 'o·boost':'#dcebfb', 'e·boost':'#dcebfb', 'o·care':'#efe4f7', 'o·hydraline':'#fbefc6', 'hydraline':'#fbefc6', 'o·répare':'#f9e3e8' };
  const fmt = n => n.toFixed(2).replace('.', ',') + ' €';
  const pct = (ref, price) => ref > price ? Math.floor((1 - price / ref) * 100 + 1e-9) : 0;
  const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const imgId = src => String(src || '').replace(/^cart-/, '').replace(/(-v\d+)?\.jpg.*$/, '');
  const solo = p => p.bundles && p.bundles[0];
  const ok = p => p && !p.virtual && !['box','cadeau'].includes(p.category) && solo(p) && solo(p).price_raw > 0;
  const firstBenefit = p => { const b = (p.benefits || [])[0]; return b ? (typeof b === 'string' ? b : b.title) : ''; };
  /* −20 % routine complète, prix en ,99 : même règle que cart.js / stripe.js */
  const barPrice = sum => { const t = Math.floor(Math.round(sum * 100) * .8); return (Math.floor((t + 1) / 100) * 100 - 1) / 100; };
  const pic = p => 'bar-' + p.id + '-hd.jpg?v=4';

  window.renderAccord = function(cur, all){
    const host = document.getElementById('pdAccord');
    if (!host || !ok(cur)) return;
    const by = {}; all.forEach(p => by[p.id] = p);
    const ck = kind(cur.id);

    /* 1. Partenaires choisis par Onaé : soins des duos/rituels de cette fiche, puis fiches qui proposent ce soin dans leurs offres */
    const picks = [], add = (id, cur8) => { const p = by[id]; if (ok(p) && id !== cur.id && !picks.find(x => x.p.id === id)) picks.push({ p, curated:cur8 }); };
    (cur.bundles || []).slice(1).forEach(b => (b.product_images || []).forEach(s => add(imgId(s), true)));
    all.forEach(p => (p.bundles || []).slice(1).forEach(b => { const ids = (b.product_images || []).map(imgId); if (ids.includes(cur.id)) ids.forEach(i => add(i, true)); }));
    /* 2. Étapes manquantes : même univers (visage/regard ou cheveux), même gamme d'abord, puis meilleures ventes */
    const used = () => new Set([ck.key, ...picks.map(x => kind(x.p.id).key)]);
    const pool = all.filter(p => ok(p) && p.id !== cur.id && kind(p.id).hair === ck.hair)
      .sort((a, b) => ((a.gamme === cur.gamme ? 0 : 1) - (b.gamme === cur.gamme ? 0 : 1)) || ((a.bestseller_rank || 99) - (b.bestseller_rank || 99)));
    pool.forEach(p => { if (picks.length < 3 && !used().has(kind(p.id).key)) add(p.id, false); });
    pool.forEach(p => { if (picks.length < 3) add(p.id, false); });
    const list = picks.slice(0, 3);
    if (!list.length) return;

    /* Toutes les formules multi-soins du catalogue, pour retrouver le prix exact d'une combinaison */
    const offers = [];
    all.forEach(p => (p.bundles || []).slice(1).forEach(b => {
      if (!(b.price_raw > 0)) return;
      const ids = (b.product_images || []).map(imgId);
      if (ids.length < 2) return;
      offers.push({ key: ids.slice().sort().join('|'), id: b.add_id || (p.id + '--' + b.id), name: b.name, price: b.price_raw, ref: b.original_price_raw || 0 });
    }));

    let sel = [list[0].p.id];
    const me = cur.name + (cur.name_line2 ? ' ' + cur.name_line2 : '');
    const rel = p => { const k = kind(p.id); return (k.rank < ck.rank ? 'Avant' : 'Après') + ' votre ' + ck.label.toLowerCase(); };

    const card = (p, mine, curated) => {
      const s = solo(p), off = pct(s.original_price_raw || 0, s.price_raw);
      return `<${mine ? 'div' : 'button type="button"'} class="acc-card${mine ? ' acc-me' : ''}" ${mine ? '' : `data-acc="${p.id}" aria-pressed="false"`}>
        ${mine ? '<span class="acc-curated">Votre soin</span>' : (curated ? '<span class="acc-curated">✦ Accord signature</span>' : '<span class="acc-curated acc-c2">Étape complémentaire</span>')}
        ${mine ? '' : '<span class="acc-tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>'}
        <div class="acc-arch" style="--g:${GBG[p.gamme] || '#f4ecef'}"><img src="${pic(p)}" alt="${esc(p.name + ' ' + (p.name_line2 || ''))}" loading="lazy" decoding="async"><span class="acc-shine"></span>
          <span class="acc-step">${mine ? ck.label : '<span class="acc-sl">' + esc(kind(p.id).label) + ' · </span>' + rel(p)}</span></div>
        <div class="acc-body">
          <p class="acc-why">${esc(firstBenefit(p))}</p>
          <p class="acc-n">${esc(p.name)}<small>${esc(p.name_line2 || '')}${p.volume ? ' · ' + esc(p.volume) : ''}</small></p>
          <p class="acc-syn">${mine ? 'Le point de départ de votre rituel. Ajoutez-lui un ou deux partenaires : le meilleur prix s\'applique tout seul.' : esc(SYN[kind(p.id).key] || '')}</p>
          <div class="acc-foot"><span class="acc-price"><b>${esc(s.price)}</b>${s.original_price ? `<s>${esc(s.original_price)}</s>` : ''}${off ? `<em>−${off} %</em>` : ''}</span>
            <span class="acc-btn">${mine ? '✓ Inclus dans votre rituel' : '+ Ajouter à mon rituel'}</span></div>
        </div><span class="acc-plus" aria-hidden="true">+</span></${mine ? 'div' : 'button'}>`;
    };

    host.innerHTML = `<section class="acc" aria-labelledby="accH"><span class="acc-dust" aria-hidden="true"></span><div class="acc-in">
      <div class="acc-head"><p class="acc-k">L'Accord parfait</p>
        <h2 class="acc-h" id="accH">Seul, il est remarquable.<br><em>Accompagné, il devient un rituel.</em></h2>
        <p class="acc-sub">Les soins qui prolongent l'effet de votre ${esc(cur.name)}, choisis par Onaé. Composez votre duo ou votre routine : le prix s'ajuste en direct.</p>
        <div class="acc-pills"><span><i></i>Prix duo &amp; rituel appliqués automatiquement</span><span><i></i>3 soins : −20 % minimum</span><span><i></i>Livraison offerte dès 49 €</span></div></div>
      <div class="acc-grid" style="--n:${list.length + 1}">${card(cur, true)}${list.map(x => card(x.p, false, x.curated)).join('')}</div>
      <div class="acc-sum" aria-live="polite"><div class="acc-sum-row">
        <div class="acc-trail" id="accTrail"></div>
        <div><p class="acc-lbl" id="accLbl"></p><p class="acc-name" id="accName"></p>
          <div class="acc-tot" style="margin-top:10px"><b id="accTot"></b><s id="accRef"></s><span class="acc-save" id="accSave"></span></div>
          <div class="acc-perks" id="accPerks"></div></div>
        <button type="button" class="acc-cta" id="accCta"></button></div>
        <p class="acc-nudge" id="accNudge"></p></div>
      <p class="acc-legal">Prix barrés = prix de référence de chaque soin. Le soin déjà présent seul dans votre panier est remplacé par l'offre, sans doublon.</p>
    </div></section>`;

    /* Meilleur prix réel pour la sélection en cours */
    function quote(){
      const ids = [cur.id, ...sel].sort((a, b) => kind(a).rank - kind(b).rank);
      const ps = ids.map(i => by[i]);
      const sum = ps.reduce((s, p) => s + solo(p).price_raw, 0);
      const ref = ps.reduce((s, p) => s + (solo(p).original_price_raw || solo(p).price_raw), 0);
      const key = ids.slice().sort().join('|');
      const cands = [{ type:'solos', price: Math.round(sum * 100) / 100, ref, name: ids.length === 3 ? 'Votre routine sur mesure' : 'Votre duo sur mesure' }];
      offers.filter(o => o.key === key)
        .forEach(o => cands.push({ type:'offer', id:o.id, price:o.price, ref: o.ref || ref, name:o.name }));
      if (ids.length === 3)
        cands.push({ type:'bar', ids, price: barPrice(sum), ref, name:'Votre routine sur mesure · −20 %' });
      const best = cands.sort((a, b) => a.price - b.price)[0];
      return Object.assign(best, { ids, ps, sum });
    }

    const $ = id => document.getElementById(id);
    function paint(){
      host.querySelectorAll('[data-acc]').forEach(b => { const on = sel.includes(b.dataset.acc); if (on !== b.classList.contains('on')) { b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.querySelector('.acc-btn').textContent = on ? '✓ Dans mon rituel' : '+ Ajouter à mon rituel'; } });
      const q = quote(), n = q.ids.length;
      $('accTrail').innerHTML = q.ps.map((p, i) => `${i ? '<span class="p">+</span>' : ''}<span class="t" style="--g:${GBG[p.gamme] || '#f4ecef'};animation-delay:${i * 70}ms"><img src="${pic(p)}" alt=""></span>`).join('');
      $('accLbl').textContent = n === 1 ? 'Votre soin seul' : (n === 2 ? 'Votre duo · 2 soins' : 'Votre routine complète · 3 soins');
      $('accName').textContent = n === 1 ? me : q.name.replace(/^Votre /, '').replace(/^./, c => c.toUpperCase());
      $('accTot').textContent = fmt(q.price);
      const save = Math.round((q.ref - q.price) * 100) / 100;
      $('accRef').textContent = q.ref > q.price ? fmt(q.ref) : '';
      $('accSave').textContent = save > 0 ? `Vous économisez ${fmt(save)} · −${pct(q.ref, q.price)} %` : '';
      $('accSave').style.display = save > 0 ? '' : 'none';
      const free = (window.OnaeCart && OnaeCart.FREE_SHIPPING) || 49;
      $('accPerks').innerHTML = [q.price >= free ? 'Livraison offerte' : `Plus que ${fmt(free - q.price)} pour la livraison offerte`, `+${Math.floor(q.price)} éclats fidélité`, 'Bombe de bain & Guide Beauté offerts'].map(t => `<span>${t}</span>`).join('');
      $('accCta').textContent = n === 1 ? `Ajouter mon soin — ${fmt(q.price)}` : `Ajouter ${n === 2 ? 'mon duo' : 'ma routine'} — ${fmt(q.price)}`;
      $('accCta').classList.remove('done');
      /* Incitation : prochaine marche de l'escalier */
      let nudge = '';
      if (n === 1) nudge = `Sélectionnez un partenaire ci-dessus : il compose avec votre ${esc(ck.label.toLowerCase())} un duo à prix doux.`;
      else if (n === 2 && list.length > 1) {
        const other = list.find(x => !sel.includes(x.p.id));
        if (other) { sel.push(other.p.id); const q3 = quote(); sel.pop();
          const extra = Math.round((q3.price - q.price) * 100) / 100;
          nudge = `<b>Passez à la routine complète :</b> ajoutez ${esc(other.p.name)} pour seulement <b>+${fmt(extra)}</b> au lieu de ${esc(solo(other.p).price)}${q3.type === 'bar' ? ' — la routine de 3 soins passe à −20 %' : ' — prix de rituel appliqué'}.`; }
      } else if (n === 3) nudge = `<b>Routine complète.</b> 3 soins, 3 gestes, dans le bon ordre : ${q.ps.map(p => esc(kind(p.id).label.toLowerCase())).join(' → ')}.`;
      $('accNudge').innerHTML = nudge;
    }

    host.addEventListener('click', e => {
      const b = e.target.closest('[data-acc]'); if (!b) return;
      const id = b.dataset.acc, i = sel.indexOf(id);
      if (i >= 0) sel.splice(i, 1); else { sel.push(id); if (sel.length > 2) sel.shift(); }
      paint();
    });

    $('accCta').addEventListener('click', () => {
      if (!window.OnaeCart) return;
      const q = quote(), C = OnaeCart;
      /* Le soin déjà présent seul dans le panier est remplacé par l'offre (pas de doublon) */
      const swap = () => q.ids.forEach(i => { const l = C.lines().find(x => x.id === i); if (l) C.set(i, l.qty - 1); });
      let okAdd = false;
      if (q.type === 'offer') { swap(); okAdd = C.addWithFeedback(q.id); }
      else if (q.type === 'bar') { const id = C.barId(q.ids); if (id) { swap(); okAdd = C.addWithFeedback(id); } }
      else { q.ids.forEach(i => { if (q.ids.length === 1 || !C.lines().find(x => x.id === i)) okAdd = C.addWithFeedback(i) || okAdd; }); }
      if (okAdd !== false) { const c = $('accCta'); c.textContent = '✓ Ajouté à votre panier'; c.classList.add('done'); setTimeout(paint, 2400); }
    });

    paint();
  };
})();
</script>
