<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produit — Onaé Paris</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #ffffff;
  --bg2:       #faf8f7;
  --ink:       #141414;
  --ink-mid:   #5a5a5a;
  --ink-light: #999;
  --accent:    #c9556e;
  --accent-bg: #f9edf0;
  --border:    rgba(20,20,20,.09);
  --font-d: 'DM Serif Display', Georgia, serif;
  --font-b: 'DM Sans', system-ui, sans-serif;
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-b);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;padding-bottom:80px}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.nav-brand{font-family:var(--font-b);font-size:14px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);text-decoration:none}
.nav-back{font-size:13px;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:6px;opacity:.65}
.nav-back:hover{opacity:1}
.nav-icons{display:flex;gap:20px;align-items:center}
.nav-icons svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.5;cursor:pointer}
.cart-badge{position:relative}
.cart-badge span{position:absolute;top:-6px;right:-7px;background:var(--accent);color:#fff;font-size:9px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* ANNOUNCE */
.announce{background:var(--ink);color:#fff;text-align:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:9px 20px}

/* GALLERY */
.gallery{position:relative;margin-bottom:20px;overflow:hidden;aspect-ratio:4/5;max-width:100%}
.gallery-slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 1.4s cubic-bezier(.4,0,.2,1);pointer-events:none}
.gallery-slide.active{opacity:1;pointer-events:auto;z-index:1}
.gallery-slide img{transform:scale(1.05);transition:transform 7s cubic-bezier(.25,.1,.25,1)}
.gallery-slide.active img{transform:scale(1)}
.gallery-placeholder{text-align:center;padding:40px 20px}
.gallery-dots{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:3}
.gallery-dots span{position:relative;width:28px;height:2px;background:rgba(20,20,20,.15);cursor:pointer;overflow:hidden;border-radius:1px}
.gallery-dots span::after{content:"";position:absolute;inset:0;background:#c9556e;transform:scaleX(0);transform-origin:left}
.gallery-dots span.done::after{transform:scaleX(1)}
.gallery-dots span.active::after{animation:dotFill var(--slide-ms,5500ms) linear forwards}
.gallery.paused .gallery-dots span.active::after{animation-play-state:paused}
@keyframes dotFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.gallery-prev,.gallery-next{position:absolute;top:50%;transform:translateY(-50%);z-index:3;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);border-radius:50%;width:40px;height:40px;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#141414;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .4s ease,background .3s ease}
.gallery:hover .gallery-prev,.gallery:hover .gallery-next{opacity:1}
.gallery-prev:hover,.gallery-next:hover{background:rgba(255,255,255,.85)}
.gallery-prev{left:14px}.gallery-next{right:14px}
.gallery .badge-pill{z-index:3}
@media (hover:none){.gallery-prev,.gallery-next{opacity:.85}}
@media (prefers-reduced-motion:reduce){.gallery-slide,.gallery-slide img{transition:none}.gallery-slide img{transform:none}}
.badge-pill{position:absolute;top:16px;left:16px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px}

/* BUY BOX */
.buybox{padding:24px 20px 0}
.prod-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:6px}
.prod-title{font-family:var(--font-d);font-size:26px;font-weight:400;line-height:1.15;color:var(--ink);margin-bottom:6px}
.prod-title span{color:var(--accent)}
.prod-subtitle{font-size:13px;color:var(--ink-mid);margin-bottom:14px;line-height:1.5}
.stars-row{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.stars{color:var(--accent);font-size:14px;letter-spacing:2px}
.stars-count{font-size:12px;color:var(--ink-mid);text-decoration:underline;cursor:pointer}

/* BUNDLE */
.bundle-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);font-weight:500;margin-bottom:10px}
.bundle-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.bundle-options>.bundle-card:nth-child(odd):last-child{grid-column:1/-1}
.bundle-card.is-soon{opacity:.5;cursor:not-allowed}
.bundle-card{border:1.5px solid var(--border);padding:14px 12px;cursor:pointer;transition:border-color .18s,background .18s;position:relative;display:flex;flex-direction:column}
.bundle-card.selected{border-color:var(--accent);background:var(--accent-bg)}
.bundle-card .bc-tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;white-space:nowrap}
/* product miniatures row */
.bundle-card .bc-imgs{display:flex;gap:5px;margin-bottom:10px;justify-content:center}
.bundle-card .bc-imgs img{width:44px;height:56px;object-fit:cover;border-radius:3px;background:var(--bg-soft)}
.bundle-card .bc-imgs .bc-img-sep{display:flex;align-items:center;font-size:14px;color:var(--ink-light);font-weight:300;align-self:center}
.bundle-card .bc-name{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:2px}
.bundle-card .bc-desc{font-size:11px;color:var(--ink-mid);margin-bottom:8px;line-height:1.4;flex:1}
/* price row */
.bundle-card .bc-price-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.bundle-card .bc-price{font-family:var(--font-d);font-size:20px;color:var(--ink)}
.bundle-card .bc-old{font-size:11px;color:var(--ink-light);text-decoration:line-through}
.bundle-card .bc-save{font-size:10px;color:#fff;font-weight:700;background:var(--accent);padding:2px 6px;border-radius:2px;letter-spacing:.03em}

/* BENEFITS */
.benefits{display:flex;flex-direction:column;gap:7px;margin-bottom:20px}
.benefit{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--ink-mid)}
.benefit-check{width:18px;height:18px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.benefit-check svg{width:10px;height:10px;stroke:#fff;stroke-width:2.5;fill:none}

/* TRUST */
.trust-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px;padding:14px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.trust-item{text-align:center}
.trust-item svg{width:20px;height:20px;stroke:var(--ink-mid);fill:none;stroke-width:1.5;margin-bottom:4px;display:block;margin-inline:auto}
.trust-item span{font-size:10px;color:var(--ink-mid);line-height:1.3;display:block}

/* CTA */
.stock-line{font-size:12px;color:var(--ink-mid);margin-bottom:12px}
.stock-line strong{color:#e05c3a}
.btn-add{display:block;width:100%;padding:17px;background:var(--ink);color:#fff;font-family:var(--font-b);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border:none;cursor:pointer;margin-bottom:10px;transition:opacity .15s}
.btn-add:hover{opacity:.85}
.btn-secondary{display:block;width:100%;padding:15px;background:transparent;color:var(--ink);font-family:var(--font-b);font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;border:1.5px solid var(--border);cursor:pointer;margin-bottom:8px;transition:border-color .15s}
.btn-secondary:hover{border-color:var(--ink)}

/* PROOF BAND */
.proof-band{background:var(--bg2);padding:22px 20px;display:flex;gap:20px;justify-content:space-around;border-top:1px solid var(--border)}
.proof-item{text-align:center}
.proof-num{font-family:var(--font-d);font-size:22px;color:var(--ink);display:block}
.proof-lbl{font-size:11px;color:var(--ink-mid);letter-spacing:.06em}

/* MINI REVIEWS */
.reviews-mini{padding:28px 20px;overflow-x:auto;display:flex;gap:14px;scrollbar-width:none}
.reviews-mini::-webkit-scrollbar{display:none}
.rcard{background:var(--bg2);padding:16px;min-width:72vw;max-width:260px;flex-shrink:0;border:1px solid var(--border)}
.rcard .r-stars{color:var(--accent);font-size:12px;margin-bottom:6px}
.rcard .r-text{font-size:12px;color:var(--ink);font-style:italic;line-height:1.55;margin-bottom:8px}
.rcard .r-author{font-size:11px;color:var(--ink-light);font-weight:500}

/* DESCRIPTION */
.desc-section{padding:16px 20px}
.sec-eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:8px}
.sec-h2{font-family:var(--font-d);font-size:24px;font-weight:400;color:var(--ink);margin-bottom:16px;line-height:1.2}
.sec-h2 span{color:var(--accent)}
.desc-text{font-size:13px;color:var(--ink-mid);line-height:1.7;margin-bottom:20px}
.steps{display:flex;flex-direction:column;gap:16px;margin-bottom:24px}
.step{display:flex;gap:14px;align-items:flex-start}
.step-num{width:32px;height:32px;border:1.5px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:14px;color:var(--ink);flex-shrink:0}
.step-body .step-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:2px}
.step-body .step-desc{font-size:12px;color:var(--ink-mid);line-height:1.5}
.ingredients{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.ingr-tag{font-size:11px;padding:5px 12px;border:1px solid var(--border);color:var(--ink-mid);letter-spacing:.04em}

/* FULL REVIEWS */
/* BEFORE/AFTER */
.before-after-section{padding:32px 0 24px}

/* ── EFFICACITÉ CLINIQUE ─────────────────────────────────── */
.efficacy-section{padding:36px 20px 28px;background:#fff}
.efficacy-inner{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center;max-width:540px;margin:0 auto}
.efficacy-stats{display:flex;flex-direction:column;gap:22px}
.efficacy-stat{}
.efficacy-pct{font-family:var(--font-d);font-size:44px;font-weight:400;color:var(--ink);line-height:1;margin-bottom:6px}
.efficacy-bar-wrap{height:5px;background:rgba(20,20,20,.1);border-radius:2px;margin-bottom:8px;overflow:hidden}
.efficacy-bar{height:100%;background:var(--ink);border-radius:2px;width:0;transition:width 1.1s cubic-bezier(.25,.1,.25,1)}
.efficacy-desc{font-size:12px;color:var(--ink-mid);line-height:1.5}
.efficacy-img-wrap{position:relative;overflow:hidden;border:1.5px solid var(--border-accent,#d4a0ab)}
.efficacy-img-wrap img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.efficacy-img-placeholder{width:100%;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:.08em;color:rgba(20,20,20,.3);background:var(--bg2,#f5f5f7);text-align:center;padding:12px}
.efficacy-ba-label{position:absolute;bottom:0;left:0;right:0;display:flex}
.efficacy-ba-label span{flex:1;text-align:center;font-size:10px;letter-spacing:.1em;font-weight:500;padding:6px 4px;color:#fff}
.efficacy-ba-label .lbl-before{background:rgba(20,20,20,.55)}
.efficacy-ba-label .lbl-after{background:rgba(201,85,110,.6)}

.ba-carousel{overflow:hidden;width:100%}
.ba-track{display:grid}
.ba-slide{grid-area:1/1;min-width:0;padding:0 20px;box-sizing:border-box;opacity:0;transition:opacity 1.4s cubic-bezier(.4,0,.2,1);pointer-events:none}
.ba-slide.active{opacity:1;pointer-events:auto;z-index:1}
.ba-slide .ba-placeholder,.ba-slide .ba-img img{transform:scale(1.04);transition:transform 7s cubic-bezier(.25,.1,.25,1)}
.ba-slide.active .ba-placeholder,.ba-slide.active .ba-img img{transform:scale(1)}
@media (prefers-reduced-motion:reduce){.ba-slide,.ba-slide .ba-placeholder,.ba-slide .ba-img img{transition:none;transform:none}}
.ba-images{display:flex;gap:10px;margin-bottom:12px}
.ba-img{flex:1;position:relative;border-radius:0;overflow:hidden}
.ba-placeholder{width:100%;aspect-ratio:3/4;background:linear-gradient(135deg,#f0e8e8 0%,#e8d8d8 100%)}
.ba-label{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.9);color:var(--ink);padding:3px 8px;border-radius:0;z-index:1}
.ba-after .ba-placeholder{background:linear-gradient(135deg,#f5ece8 0%,#ead5cc 100%)}
.ba-img img{cursor:zoom-in}
.ba-lb{position:fixed;inset:0;z-index:10000;background:rgba(20,16,14,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(56px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));opacity:0;transition:opacity .45s cubic-bezier(.4,0,.2,1)}
.ba-lb.open{opacity:1}
.ba-lb-stage{position:relative;width:min(100%,560px);aspect-ratio:3/4;max-height:calc(100vh - 190px);max-height:calc(100dvh - 190px)}
.ba-lb-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(.985);transition:opacity .6s ease,transform .6s ease}
.ba-lb-stage img.on{opacity:1;transform:scale(1)}
.ba-lb-tabs{display:flex;gap:0;border:1px solid rgba(255,255,255,.35)}
.ba-lb-tabs button{background:none;border:none;color:rgba(255,255,255,.7);font:500 11px/1 var(--font-b,'DM Sans',sans-serif);letter-spacing:.2em;text-transform:uppercase;padding:12px 26px;cursor:pointer;transition:background .3s,color .3s}
.ba-lb-tabs button.on{background:#fff;color:#141414}
.ba-lb-cap{color:rgba(255,255,255,.75);font-size:12px;letter-spacing:.04em;text-align:center}
.ba-lb-close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:42px;height:42px;background:none;border:1px solid rgba(255,255,255,.35);color:#fff;font-size:22px;line-height:1;cursor:pointer}
.ba-caption{font-size:12px;color:var(--ink-mid);text-align:center}
.ba-dots{display:flex;justify-content:center;gap:8px;margin-top:18px}
.ba-dot{position:relative;width:28px;height:2px;border-radius:1px;background:rgba(20,20,20,.12);cursor:pointer;overflow:hidden}
.ba-dot::after{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left}
.ba-dot.done::after{transform:scaleX(1)}
.ba-dot.active::after{animation:dotFill var(--slide-ms,5500ms) linear forwards}
.ba-carousel.paused~.ba-dots .ba-dot.active::after,.before-after-section.paused .ba-dot.active::after{animation-play-state:paused}
.reviews-section{background:var(--bg2);padding:32px 20px}
.review-summary{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.review-big-num{font-family:var(--font-d);font-size:48px;color:var(--ink);line-height:1}
.review-bars{flex:1;display:flex;flex-direction:column;gap:4px}
.rbar{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-mid)}
.rbar-track{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.rbar-fill{height:100%;background:var(--accent);border-radius:2px}
.review-card{background:var(--bg);padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.review-card .rc-head{display:flex;justify-content:space-between;margin-bottom:6px;font-size:11px;color:var(--ink-light)}
.review-card .rc-stars{color:var(--accent);font-size:12px;margin-bottom:4px}
.review-card .rc-text{font-size:13px;color:var(--ink);line-height:1.6}

/* FAQ */
.faq-section{padding:32px 20px}
.faq-item{border-bottom:1px solid var(--border);padding:14px 0}
.faq-q{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink);gap:12px}
.faq-q svg{flex-shrink:0;width:16px;height:16px;stroke:var(--ink-mid);fill:none;stroke-width:2;transition:transform .2s}
.faq-a{font-size:13px;color:var(--ink-mid);line-height:1.65;max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s}
.faq-item.open .faq-a{max-height:200px;padding-top:10px}
.faq-item.open .faq-q svg{transform:rotate(45deg)}

/* STICKY CTA */
.sticky-cta{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--bg);border-top:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;transform:translateY(100%);transition:transform .3s}
.sticky-cta.visible{transform:translateY(0)}
.sticky-price{font-family:var(--font-d);font-size:20px;color:var(--ink)}
.sticky-price small{font-family:var(--font-b);font-size:11px;color:var(--ink-light);display:block;font-style:normal}
.sticky-btn{flex:1;padding:14px;background:var(--ink);color:#fff;border:none;font-family:var(--font-b);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}

/* LOADING */

/* ════════ EFFICACITÉ ════════ */
.eff{position:relative;overflow:hidden;background:#160f13;color:#fff;padding:72px 20px 56px;isolation:isolate}
.eff-glow{position:absolute;inset:-30% -10% auto;height:120%;background:radial-gradient(50% 45% at 50% 35%,rgba(201,85,110,.38),transparent 70%),radial-gradient(35% 35% at 85% 80%,rgba(230,199,156,.18),transparent 70%);z-index:-1;animation:effDrift 14s ease-in-out infinite alternate}
@keyframes effDrift{to{transform:translate3d(0,-4%,0) scale(1.06)}}
.eff-in{max-width:1180px;margin:0 auto}
.eff-head{text-align:center;max-width:720px;margin:0 auto}
.eff-eyebrow{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:#e6c79c;margin-bottom:16px}
.eff-h2{font-family:var(--font-d);font-weight:400;font-size:clamp(36px,6vw,64px);line-height:1.02;letter-spacing:-.01em}
.eff-h2 em{font-style:italic;color:#e8a0b0}
.eff-claim{margin-top:20px;font-size:15px;line-height:1.75;color:rgba(255,255,255,.72)}
.eff-line{position:relative;height:1px;margin:52px auto 0;max-width:820px;background:rgba(255,255,255,.12)}
.eff-line i{position:absolute;inset:0;background:linear-gradient(90deg,transparent,#e6c79c,#c9556e,transparent);transform:scaleX(0);transform-origin:left;transition:transform 2.4s cubic-bezier(.16,1,.3,1)}
.eff.on .eff-line i{transform:none}
.eff-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:-1px}
.eff-stat{text-align:center;opacity:0;transform:translateY(26px);transition:opacity 1s cubic-bezier(.16,1,.3,1),transform 1.2s cubic-bezier(.16,1,.3,1);transition-delay:calc(var(--k)*.38s)}
.eff.on .eff-stat{opacity:1;transform:none}
.eff-ring{position:relative;width:100%;max-width:220px;aspect-ratio:1;margin:28px auto 0}
.eff-ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.eff-track{fill:none;stroke:rgba(255,255,255,.09);stroke-width:4}
.eff-arc{fill:none;stroke:#e8a0b0;stroke-width:4;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 2s cubic-bezier(.16,1,.3,1);transition-delay:calc(var(--k)*.38s);filter:drop-shadow(0 0 10px rgba(232,160,176,.55))}
.eff.on .eff-arc{stroke-dashoffset:calc(100 - var(--p))}
.eff-stat:nth-child(3) .eff-arc{stroke:#e6c79c;filter:drop-shadow(0 0 12px rgba(230,199,156,.6))}
.eff-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);line-height:1}
.eff-val b{font-weight:400;font-size:clamp(30px,7vw,72px);font-variant-numeric:tabular-nums}
.eff-val span{font-size:clamp(13px,2vw,24px);margin-left:2px;align-self:flex-start;margin-top:30%;color:rgba(255,255,255,.6)}
.eff-when{margin-top:16px;font-size:clamp(9px,1vw,11px);letter-spacing:.2em;line-height:1.5;text-transform:uppercase;color:#e6c79c}
.eff-desc{margin:8px auto 0;max-width:30ch;font-size:13.5px;line-height:1.6;color:rgba(255,255,255,.65)}
.eff-src{margin:48px auto 0;max-width:720px;text-align:center;font-size:11px;line-height:1.7;color:rgba(255,255,255,.45);letter-spacing:.02em}
@media(min-width:1024px){

  .bundle-card{padding:20px 14px 16px}

<body>

<div id="app">
  <div class="loading">Chargement…</div>
</div>

<div class="sticky-cta" id="sticky">
  <div class="sticky-price">
    <span id="sticky-price"></span>
    <small id="sticky-label"></small>
  </div>
  <button class="sticky-btn" onclick="addToCart()">Ajouter au panier</button>
</div>

<script>
// ─── State ──────────────────────────────────────────────
let product = null;
let currentBundle = null;

// ─── Utils ──────────────────────────────────────────────
function stars(n) {
  return '★'.repeat(Math.floor(n)) + (n % 1 >= 0.5 ? '★' : '') + '☆'.repeat(5 - Math.ceil(n));
}
function starsExact(n) {
  let s = '';
  for (let i = 1; i <= 5; i++) s += i <= n ? '★' : '☆';
  return s;
}
function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Render ─────────────────────────────────────────────
function render(p) {
  // Pick default bundle (popular one, or first)
  const defaultBundle = p.bundles.find(b => b.popular && b.price_raw > 0) || p.bundles.find(b => b.price_raw > 0) || p.bundles[0];
  currentBundle = defaultBundle.id;

  // Build bundle cards HTML
  const bundleCards = p.bundles.map(b => {
    // Product miniatures
    let imgsHTML = '';
    if (b.product_images && b.product_images.length) {
      const imgTags = b.product_images.map((src, i) =>
        (i > 0 ? '<span class="bc-img-sep">+</span>' : '') +
        `<img src="${esc(src)}" alt="" loading="lazy">`
      ).join('');
      imgsHTML = `<div class="bc-imgs">${imgTags}</div>`;
    }
    // Price row with optional strikethrough and savings badge
    const priceHTML = `<div class="bc-price-row">
      <span class="bc-price">${esc(b.price)}</span>
      ${b.original_price ? `<span class="bc-old">${esc(b.original_price)}</span>` : ''}
      ${b.savings ? `<span class="bc-save">${esc(b.savings)}</span>` : ''}
    </div>`;
    return `
    <div class="bundle-card${b.id === defaultBundle.id ? ' selected' : ''}${b.price_raw > 0 ? '' : ' is-soon'}" id="opt-${esc(b.id)}" onclick="${b.price_raw > 0 ? `selectBundle('${esc(b.id)}')` : ''}" ${b.price_raw > 0 ? '' : 'aria-disabled="true"'}>
      ${(b.popular || b.tag) ? `<span class="bc-tag">${esc(b.popular ? b.popular_label : b.tag)}</span>` : ''}
      ${imgsHTML}
      <p class="bc-name">${esc(b.name)}</p>
      <p class="bc-desc">${esc(b.description)}</p>
      ${priceHTML}
    </div>`;
  }).join('');

  // Benefits — accepte string simple OU objet {title, desc}
  const benefitsHTML = p.benefits.map(b => {
    const text = typeof b === 'string' ? b : (b.title && b.desc ? `<strong>${esc(b.title)}</strong> — ${esc(b.desc)}` : esc(b.title || b.desc || ''));
    return `<div class="benefit">
      <div class="benefit-check"><svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg></div>
      <span>${text}</span>
    </div>`;
  }).join('');

  // Proof band
  const proofHTML = p.proof.map(item => `
    <div class="proof-item">
      <span class="proof-num">${esc(item.value)}</span>
      <span class="proof-lbl">${esc(item.label)}</span>
    </div>
  `).join('');

  // Mini reviews (first 3)
  const miniReviewsHTML = p.reviews.slice(0,3).map(r => `
    <div class="rcard">
      <div class="r-stars">${starsExact(r.rating)}</div>
      <p class="r-text">"${esc(r.text)}"</p>
      <span class="r-author">${esc(r.name)} — achat vérifié</span>
    </div>
  `).join('');

  // How to use steps — accepte string simple OU objet {step, title, desc}
  const stepsHTML = p.how_to_use.map((s, i) => {
    const num = typeof s === 'string' ? i + 1 : (s.step || i + 1);
    const title = typeof s === 'string' ? '' : esc(s.title || '');
    const desc = typeof s === 'string' ? esc(s) : esc(s.desc || '');
    return `<div class="step">
      <div class="step-num">${num}</div>
      <div class="step-body">
        ${title ? `<p class="step-title">${title}</p>` : ''}
        <p class="step-desc">${desc}</p>
      </div>
    </div>`;
  }).join('');

  // Ingredients
  const ingrHTML = p.ingredients.map(i => `<span class="ingr-tag">${esc(i)}</span>`).join('');

  // Review bars
  const rbarsHTML = [5,4,3,2,1].map(n => `
    <div class="rbar">
      <span style="width:16px">${n}★</span>
      <div class="rbar-track"><div class="rbar-fill" style="width:${p.review_bars[n]}%"></div></div>
      <span>${p.review_bars[n]}%</span>
    </div>
  `).join('');

  // Full reviews
  const fullReviewsHTML = p.reviews.map(r => `
    <div class="review-card">
      <div class="rc-head"><span>${esc(r.name)}</span><span>${esc(r.date)}</span></div>
      <div class="rc-stars">${starsExact(r.rating)}</div>
      <p class="rc-text">"${esc(r.text)}"</p>
    </div>
  `).join('');

  // FAQ
  const faqHTML = p.faq.map(item => `
    <div class="faq-item">
      <div class="faq-q" onclick="toggleFaq(this)">
        ${esc(item.q)}
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
      <div class="faq-a">${esc(item.a)}</div>
    </div>
  `).join('');

  // Stock line
  const stockHTML = p.stock_urgent
    ? `⚡ <strong>${esc(p.stock_label)}</strong>`
    : esc(p.stock_label);

  document.getElementById('app').innerHTML = `
    <!-- Announce bar -->
    <div class="announce">Livraison offerte dès 59 € &nbsp;·&nbsp; Résultats visibles en 4 semaines</div>

    <!-- Nav -->
    <nav class="nav">
      <div class="nav-l">
      <a href="index.html" class="nav-back">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2"><polyline points="15 18 9 12 15 6"/></svg>
        Retour
      </a>
      <div class="nav-links"><a href="soins-visage.html">Soins visage</a><a href="soins-yeux.html">Soins yeux</a><a href="soins-cheveux.html">Soins cheveux</a><a href="nouveautes.html">Nouveautés</a><a href="box.html">Box</a><a href="carte-cadeau.html">Cadeaux</a></div>
      </div>
      <a href="index.html" class="nav-brand">ONAĒ</a>
      <div class="nav-icons">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <a href="panier.html" class="cart-badge" aria-label="Panier">
          <svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span>0</span>
        </a>
      </div>
    </nav>

    <!-- Buy box -->
    <p class="pd-crumb"><a href="index.html">Accueil</a> · <a href="${p.category === 'cheveux' ? 'soins-cheveux.html' : p.category === 'yeux' ? 'soins-yeux.html' : p.category === 'box' ? 'box.html' : 'soins-visage.html'}">${p.category === 'cheveux' ? 'Soins cheveux' : p.category === 'yeux' ? 'Soins yeux' : p.category === 'box' ? 'Les Box' : 'Soins visage'}</a> · <span>${esc(p.name)} ${esc(p.name_line2)}</span></p>
    <div class="buybox" id="buy-box">
      <div class="pd-media">
      ${(() => { const imgs = (p.gallery && p.gallery.length) ? p.gallery : (p.image ? [p.image] : []);
        return imgs.length > 1 ? `<div class="pd-thumbs">${imgs.map((src,i)=>`<button type="button" class="${i===0?'on':''}" data-thumb="${i}" aria-label="Photo ${i+1}"><img src="${esc(src)}" alt="" loading="lazy"></button>`).join('')}</div>` : ''; })()}
      <div class="gallery" id="gallery">
        ${(() => {
          const imgs = (p.gallery && p.gallery.length) ? p.gallery : (p.image ? [p.image] : []);
          const slides = imgs.map((src, i) => `<div class="gallery-slide${i===0?' active':''}" data-index="${i}" style="background:${p.gallery_gradient}">
              <img src="${esc(src)}" alt="${esc(p.image_alt||p.name)}" style="width:100%;height:100%;object-fit:cover">
            </div>`).join('');
          const dots = imgs.length > 1 ? `<div class="gallery-dots">${imgs.map((_,i)=>`<span class="${i===0?'active':''}" data-dot="${i}"></span>`).join('')}</div>` : '';
          const arrows = imgs.length > 1 ? `<button class="gallery-prev" aria-label="Précédent">&#8249;</button><button class="gallery-next" aria-label="Suivant">&#8250;</button>` : '';
          return slides + arrows + dots;
        })()}
        ${p.badge ? `<span class="badge-pill">${esc(p.badge)}</span>` : ''}
      </div>
      </div>
      <div class="pd-info">

      <p class="prod-label">${esc(p.gamme)} — ${esc(p.gamme_label)}</p>
      <h1 class="prod-title">${esc(p.name)} <span>${esc(p.name_line2)}</span></h1>
      <p class="prod-subtitle">${esc(p.subtitle)}</p>

      <div class="stars-row">
        <span class="stars">${stars(p.rating)}</span>
        <span class="stars-count" onclick="document.getElementById('reviews').scrollIntoView({behavior:'smooth'})">${p.review_count ? `${p.rating} / 5 · ${p.review_count} avis` : 'Nouveauté · Soyez la première à donner votre avis'}</span>
      </div>

      <p class="bundle-label">Choisissez votre formule</p>
      <div class="bundle-options">${bundleCards}</div>

      <div class="benefits">${benefitsHTML}</div>

      <div class="trust-row">
        <div class="trust-item">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>Paiement sécurisé</span>
        </div>
        <div class="trust-item">
          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          <span>Expédition 24h</span>
        </div>
        <div class="trust-item">
          <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4"/></svg>
          <span>Retours 30 j</span>
        </div>
        <div class="trust-item">
          <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>Certifié CE</span>
        </div>
      </div>

      <p class="stock-line">${stockHTML}</p>
      <button class="btn-add" id="add-btn" onclick="addToCart()">Ajouter au panier — <span id="price-display">${esc(defaultBundle.price)}</span></button>
      <button class="btn-secondary" onclick="addToCart();setTimeout(()=>location.href='panier.html',600)">Acheter maintenant</button>
      <div class="pd-proof">${proofHTML}</div>
      </div>
    </div>

    <div class="reviews-mini">${miniReviewsHTML}</div>

    <div class="desc-section pd-story">
      <div class="pd-story-h">
        <p class="sec-eyebrow">Vos bénéfices</p>
        <h2 class="sec-h2">${esc(p.name)}<br><span>${esc(p.name_line2)}</span></h2>
      </div>
      <div class="pd-story-b">
        <p class="desc-text">${esc(p.description)}</p>
        <div class="pd-volume"><span>${esc(p.volume || '')}</span><span>${esc(p.gamme_label || '')}</span><span>Formule clean beauty</span></div>
      </div>
    </div>

    <!-- SECTION AVANT/APRÈS : uniquement les vraies photos de clientes -->
    ${p.id === 'serum-anti-age-peptides' ? `<div class="before-after-section">
      <div class="pd-ba-h">
      <p class="sec-eyebrow">Vos résultats</p>
      <h2 class="sec-h2" style="margin-bottom:6px">Avant <span>/ Après</span></h2>
      <p class="pd-ba-sub">Photos de cliente, non retouchées. Résultat personnel, variable selon les peaux.</p>
      </div>
      <div class="ba-carousel">
        <div class="ba-track" id="baTrack">
          <div class="ba-slide">
            <div class="ba-images">
              <div class="ba-img ba-before"><span class="ba-label">Avant</span><img src="avis-avant-1.jpg" alt="Sophie, avant" loading="lazy" style="width:100%;aspect-ratio:3/4;object-fit:cover;display:block"></div>
              <div class="ba-img ba-after"><span class="ba-label">Après</span><img src="avis-apres-1.jpg" alt="Sophie, après utilisation du Sérum aux Peptides" loading="lazy" style="width:100%;aspect-ratio:3/4;object-fit:cover;display:block"></div>
            </div>
            <p class="ba-caption">Sophie · Sérum Visage Anti-âge aux Peptides</p>
          </div>
        </div>
      </div>
    </div>` : ''}

    <!-- SECTION EFFICACITÉ (affichée seulement si un test d'usage sourcé existe) -->
    ${(() => { const E = (p.efficacy && p.efficacy.stats && p.efficacy.source) ? p.efficacy : { pending:true, claim:"Ce soin fait l'objet d'un test d'usage. Ses résultats seront publiés ici très prochainement.", stats:[{when:'Après 3 semaines'},{when:'Après 2 mois'},{when:'Après 3 mois'}], source:'' }; return E; })() && (p._eff = (p.efficacy && p.efficacy.stats && p.efficacy.source) ? p.efficacy : { pending:true, claim:"Ce soin fait l'objet d'un test d'usage. Ses résultats seront publiés ici très prochainement.", stats:[{when:'Après 3 semaines'},{when:'Après 2 mois'},{when:'Après 3 mois'}], source:'' }) ? `<section class="eff${p._eff.pending ? ' eff-pending' : ''}" id="efficacy-section">
      <div class="eff-glow" aria-hidden="true"></div>
      <div class="eff-in">
        <div class="eff-head">

  // Init sticky
  document.getElementById('sticky-price').textContent = defaultBundle.price;
  document.getElementById('sticky-label').textContent = defaultBundle.name;

  // Update page title
  document.title = `${p.name} ${p.name_line2} — Onaé Paris`;

  // Efficacy section : anneaux + compteurs animés à l'apparition
  const eff = document.getElementById('efficacy-section');
  if (eff) {
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const run = () => {
      eff.classList.add('on');
      eff.querySelectorAll('.eff-val b').forEach((b, k) => {
        const to = +b.dataset.to, t0 = performance.now() + k * 380, D = 1800;
        if (still) { b.textContent = to; return; }
        const tick = now => { const x = Math.min(1, Math.max(0, (now - t0) / D)); b.textContent = Math.round(to * (1 - Math.pow(1 - x, 4))); if (x < 1) requestAnimationFrame(tick); };
        requestAnimationFrame(tick);
      });
    };
    new IntersectionObserver((es, o) => { if (es[0].isIntersecting) { run(); o.disconnect(); } }, { threshold: .35 }).observe(eff);
  }

  // Gallery dots
  // Carrousel gallery
  const gallery = document.getElementById('gallery');
  if (gallery) {
    const slides = gallery.querySelectorAll('.gallery-slide');
    const dots   = gallery.querySelectorAll('.gallery-dots span');
    const SLIDE_MS = 5500;
    gallery.style.setProperty('--slide-ms', SLIDE_MS + 'ms');
    let current  = 0;
    function goTo(n) {
      slides[current].classList.remove('active');
      current = (n + slides.length) % slides.length;
      slides[current].classList.add('active');
      dots.forEach((d, i) => {
        d.classList.remove('active', 'done');
        void d.offsetWidth; // relance l'animation de progression
        if (i < current) d.classList.add('done');
        if (i === current) d.classList.add('active');
      });
      document.querySelectorAll('.pd-thumbs button').forEach((t, i) => t.classList.toggle('on', i === current));
    }
    document.querySelectorAll('.pd-thumbs button').forEach(t => t.addEventListener('click', () => { goTo(+t.dataset.thumb); resetAuto(); }));
    dots.forEach(dot => dot.addEventListener('click', () => { goTo(+dot.dataset.dot); resetAuto(); }));
    gallery.querySelector('.gallery-prev')?.addEventListener('click', () => { goTo(current - 1); resetAuto(); });
    gallery.querySelector('.gallery-next')?.addEventListener('click', () => { goTo(current + 1); resetAuto(); });
    // Swipe touch
    let tx = 0;
    gallery.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
    gallery.addEventListener('touchend',   e => {
      const dx = e.changedTouches[0].clientX - tx;
      if (Math.abs(dx) > 40) { goTo(current + (dx < 0 ? 1 : -1)); resetAuto(); }
    }, { passive: true });
    // Défilement automatique lent, en fondu
    let autoTimer = null;
    function resetAuto() {
      clearInterval(autoTimer);
      if (slides.length > 1) autoTimer = setInterval(() => goTo(current + 1), SLIDE_MS);
    }
    goTo(0);
    resetAuto();
    // Pause au survol
    gallery.addEventListener('mouseenter', () => { clearInterval(autoTimer); gallery.classList.add('paused'); });
    gallery.addEventListener('mouseleave', () => { gallery.classList.remove('paused'); goTo(current); resetAuto(); });
  }

  // Scroll spy for sticky
  const buyBox = document.getElementById('buy-box');
  function checkScroll() {
    if (!buyBox) return;
    const rect = buyBox.getBoundingClientRect();
    document.getElementById('sticky').classList.toggle('visible', rect.bottom < 0);
  }
  window.addEventListener('scroll', checkScroll, { passive: true });
}

  document.getElementById('sticky-price').textContent = b.price;
  document.getElementById('sticky-label').textContent = b.name;
}

// ─── Add to cart ──────────────────────────────────────
function addToCart() {
  if (!product || !currentBundle) return;
  const b = product.bundles.find(b => b.id === currentBundle);
  const btn = document.getElementById('add-btn');
  if (!b || !(b.price_raw > 0)) return;
  if (window.OnaeCart) {
    if (b.add_id && OnaeCart.CATALOG[b.add_id]) OnaeCart.addWithFeedback(b.add_id);
    else if (b.id === 'solo' && OnaeCart.CATALOG[product.id]) OnaeCart.addWithFeedback(product.id);
    else {
      const base = (window.OnaeCart && OnaeCart.CATALOG[product.id]) || {};
      OnaeCart.addWithFeedback(b.id === 'solo' ? product.id : product.id + '--' + b.id, {
        name: b.id === 'solo' ? product.name : b.name,
        sub: b.id === 'solo' ? (product.name_line2 || '') : product.name + ' ' + (product.name_line2 || ''),
        gamme: base.gamme || product.gamme_label || product.gamme || '',
        color: base.color || '#f0ece8',
        deep:  base.deep  || '#9b6fb5',
        price: b.price_raw, vol: b.description || product.volume || '',
        img: base.img || product.image
      });
    }
  }
  btn.textContent = '✓ Ajouté au panier !';
  btn.style.background = '#2a7a4b';
  setTimeout(() => {
    btn.innerHTML = `Ajouter au panier — <span id="price-display">${b ? b.price : ''}</span>`;
    btn.style.background = '';
  }, 2000);
}

// ─── FAQ ─────────────────────────────────────────────
// Before/After carousel
let baIndex = 0;
const BA_MS = 5500;
let baTimer = null;
function baGo(n) {
  const track = document.getElementById('baTrack');
  if (!track) return;
  const slides = [...track.children];
  baIndex = (n + slides.length) % slides.length;
  slides.forEach((s, i) => s.classList.toggle('active', i === baIndex));
  document.querySelectorAll('.ba-dot').forEach((d, i) => {
    d.classList.remove('active', 'done');
    void d.offsetWidth; // relance la barre de progression
    if (i < baIndex) d.classList.add('done');
    if (i === baIndex) d.classList.add('active');
  });
}
function baResetAuto() {
  clearInterval(baTimer);
  baTimer = setInterval(() => baGo(baIndex + 1), BA_MS);
}
// Démarre dès que la section est rendue
(function waitBA(){
  const track = document.getElementById('baTrack');
  if (!track) return setTimeout(waitBA, 200);
  const section = track.closest('.before-after-section');
  section?.style.setProperty('--slide-ms', BA_MS + 'ms');
  baGo(0);
  baResetAuto();
  section?.addEventListener('mouseenter', () => { clearInterval(baTimer); section.classList.add('paused'); });
  section?.addEventListener('mouseleave', () => { section.classList.remove('paused'); baGo(baIndex); baResetAuto(); });
})();
document.addEventListener('click', e => {
  const dot = e.target.closest('.ba-dot');
  if (dot) { baGo([...dot.parentElement.children].indexOf(dot)); baResetAuto(); }
});
// Swipe support
(function(){
  let sx = 0;
  document.addEventListener('touchstart', e => { const t = e.target.closest('.ba-carousel'); if(t) sx = e.touches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', e => { const t = e.target.closest('.ba-carousel'); if(t){ const dx = e.changedTouches[0].clientX - sx; if(Math.abs(dx)>40) { baGo(baIndex + (dx<0?1:-1)); baResetAuto(); } }}, {passive:true});
})();


// Lightbox Avant / Après
document.addEventListener('click', e => {
  const img = e.target.closest('.ba-img img');
  if (!img) return;
  const slide = img.closest('.ba-slide');
  const pair = [...slide.querySelectorAll('.ba-img img')];
  if (!pair.length) return;
  const startIdx = pair.indexOf(img);
  const labels = [...slide.querySelectorAll('.ba-img')].map(d => d.querySelector('.ba-label')?.textContent || '');
  const cap = slide.querySelector('.ba-caption')?.textContent || '';
  clearInterval(baTimer);
  const lb = document.createElement('div');
  lb.className = 'ba-lb';
  lb.setAttribute('role','dialog'); lb.setAttribute('aria-modal','true');
  lb.innerHTML = `<button class="ba-lb-close" aria-label="Fermer">&times;</button>
    <div class="ba-lb-stage">${pair.map(p => `<img src="${p.getAttribute('src')}" alt="${p.alt}">`).join('')}</div>
    <div class="ba-lb-tabs">${labels.map(l => `<button>${l}</button>`).join('')}</div>
    <p class="ba-lb-cap">${cap}</p>`;
  document.body.appendChild(lb);
  document.body.style.overflow = 'hidden';
  const imgs = lb.querySelectorAll('.ba-lb-stage img'), tabs = lb.querySelectorAll('.ba-lb-tabs button');
  let cur = startIdx;
  const show = i => { cur = (i + imgs.length) % imgs.length; imgs.forEach((m,k)=>m.classList.toggle('on',k===cur)); tabs.forEach((t,k)=>t.classList.toggle('on',k===cur)); };
  show(startIdx);
  requestAnimationFrame(() => lb.classList.add('open'));
  tabs.forEach((t,k) => t.addEventListener('click', ev => { ev.stopPropagation(); show(k); }));
  const close = () => { lb.classList.remove('open'); document.body.style.overflow=''; document.removeEventListener('keydown', onKey); setTimeout(()=>lb.remove(),450); baGo(baIndex); baResetAuto(); };
  const onKey = ev => { if (ev.key==='Escape') close(); if (ev.key==='ArrowRight'||ev.key==='ArrowLeft') show(cur+1); };
  document.addEventListener('keydown', onKey);
  lb.querySelector('.ba-lb-close').addEventListener('click', close);
  lb.addEventListener('click', ev => { if (ev.target === lb) close(); });
  let sx=0;
  lb.addEventListener('touchstart', ev => { sx = ev.touches[0].clientX; }, {passive:true});
  lb.addEventListener('touchend', ev => { const dx = ev.changedTouches[0].clientX - sx; if (Math.abs(dx)>40) show(cur + (dx<0?1:-1)); }, {passive:true});
});

// ─── Load (source unique : products.json) ─────────────────────────────────────────────
/* PRODUCTS_DATA est chargé depuis le serveur — plus de copie inline */
function init() {
  const params = new URLSearchParams(window.location.search);
  const fromPath = (location.pathname.match(/^\/produits\/([^/]+)/) || [])[1];
  const id = params.get('id') || (fromPath && decodeURIComponent(fromPath)) || 'serum-anti-age-peptides';
  fetch('/products.json?v=6')
    .then(r => r.json())
    .then(data => {
      product = data.products.find(p => p.id === id || p.slug === id)
                || data.products[0];
      /* Aperçu privé de la section Efficacité : ?apercu=1 (non visible des clientes) */
      if (params.get('apercu') === '1' && !product.efficacy) {
        product.efficacy = { claim: "ont constaté une amélioration de leurs cheveux : cheveux réhydratés, plus résistants et plus forts, cuir chevelu hydraté, apaisé et revitalisé, chevelure plus éclatante et brillante.",
          stats: [{pct:81, when:'Après 3 semaines'}, {pct:85, when:'Après 2 mois'}, {pct:97, when:'Après 3 mois'}],
          source: "Aperçu privé — source du test d'usage à confirmer avant publication." };
      }
      render(product);
    })
    .catch(err => {
      document.querySelector('.prod-name') && (document.querySelector('.prod-name').textContent = 'Produit introuvable');
      console.error('products.json', err);
    });
}
init();

.rvm.sent .rvm-done path{animation:rvDraw .5s ease .6s forwards}
@keyframes rvDraw{to{stroke-dashoffset:0}}
.rvm-done h3{margin-top:16px;font-family:var(--font-d);font-weight:400;font-size:30px}
.rvm-done h3 em{color:var(--accent)}
.rvm-done p{margin:10px auto 0;max-width:380px;font-size:14px;line-height:1.65;color:var(--ink-mid)}
.rvm-done button{margin-top:22px;padding:15px 28px;border-radius:999px;border:1px solid var(--ink);background:none;font:600 11.5px var(--font-b);letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
</style>
<script>
/* ═══ Avis clients : affichage des avis publiés et dépôt d'un avis ═══ */
(function(){
  const LAB = ['', 'Décevant', 'Moyen', 'Bien', 'Très bien', 'Exceptionnel'];
  const STAR = '<svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3.1 1.2-6.5L2.5 9.5l6.6-.9z"/></svg>';
  const fmtDate = s => { try { return new Date(s).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' }); } catch(_) { return ''; } };
  let rating = 0, skin = '', modal = null, busy = false;

  function build(){
    if(modal) return modal;
    const p = product;
    modal = document.createElement('div'); modal.className = 'rvm'; modal.setAttribute('role','dialog'); modal.setAttribute('aria-modal','true'); modal.setAttribute('aria-label','Laisser un avis');
    modal.innerHTML = `<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="rvGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dfb8"/><stop offset=".5" stop-color="#d4a86a"/><stop offset="1" stop-color="#b9864a"/></linearGradient></defs></svg>
    <div class="rvm-bd" data-close></div>
    <div class="rvm-p">
      <div class="rvm-top"><button class="rvm-x" type="button" data-close aria-label="Fermer">×</button>
        <div class="rvm-prod"><img src="cart-${esc(p.id)}.jpg" alt="" onerror="this.src='${esc(p.image)}'"><div><small>Votre avis compte</small><b>${esc(p.name)} ${esc(p.name_line2 || '')}</b></div></div></div>
      <form class="rvm-f" novalidate>
        <div><p class="rvm-q" style="text-align:center">Votre note</p><div class="rvm-stars" role="radiogroup" aria-label="Note sur 5">${[1,2,3,4,5].map(n => `<button type="button" role="radio" aria-checked="false" aria-label="${n} sur 5 · ${LAB[n]}" data-n="${n}">${STAR}</button>`).join('')}</div><p class="rvm-lab" id="rvLab">Touchez une étoile</p></div>
        <label class="rvm-in"><span class="rvm-q">Titre de votre avis</span><input name="title" maxlength="90" placeholder="Ex. Ma peau n'a jamais été aussi douce"></label>
        <label class="rvm-in"><span class="rvm-q">Votre expérience</span><textarea name="text" maxlength="2000" placeholder="Texture, sensation, résultats après quelques jours… Racontez-nous."></textarea><span class="rvm-cnt" id="rvCnt">20 caractères minimum</span></label>
        <div><p class="rvm-q" style="margin-bottom:9px">Votre type de peau <span style="text-transform:none;letter-spacing:0;font-weight:400">(facultatif)</span></p><div class="rvm-skins">${['Sèche','Normale','Mixte','Grasse','Sensible'].map(s => `<button type="button" data-s="${s}">${s}</button>`).join('')}</div></div>
        <div class="rvm-2"><label class="rvm-in"><span class="rvm-q">Prénom</span><input name="name" maxlength="40" autocomplete="given-name" placeholder="Votre prénom"></label><label class="rvm-in"><span class="rvm-q">E-mail</span><input name="email" type="email" autocomplete="email" placeholder="vous@exemple.fr"></label></div>
        <input name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
        <label class="rvm-ck"><input type="checkbox" name="consent"><span>J'accepte que mon avis soit publié sur le site avec mon prénom. Mon e-mail ne sera jamais affiché : il sert uniquement à vérifier mon avis.</span></label>
        <p class="rvm-err" id="rvErr" aria-live="polite"></p>
        <button class="rvm-go" type="submit">Publier mon avis</button>
      </form>
      <p class="rvm-fine">Chaque avis est relu par notre équipe avant publication, sous 48 h environ. Nous publions tous les avis conformes, positifs comme négatifs. La mention « Achat vérifié » apparaît lorsque l'e-mail correspond à une commande de ce soin.</p>
      <div class="rvm-done" aria-live="polite"><svg viewBox="0 0 86 86"><circle cx="43" cy="43" r="38"/><path d="M27 44l11 11 22-24"/></svg><h3>Merci, <em id="rvName">vraiment</em>.</h3><p>Votre avis a bien été reçu. Il sera publié après relecture par notre équipe, sous 48 h environ. Il aidera d'autres femmes à choisir le soin qui leur convient.</p><button type="button" data-close>Revenir au soin</button></div>
    </div>`;
    document.body.appendChild(modal);
    const f = modal.querySelector('form'), sb = [...modal.querySelectorAll('.rvm-stars button')], lab = modal.querySelector('#rvLab');
    const paint = (n, keep) => sb.forEach((b, i) => { b.classList.toggle('on', i < n); if(keep) b.setAttribute('aria-checked', i + 1 === n); });
    sb.forEach(b => {
      b.addEventListener('mouseenter', () => { paint(+b.dataset.n); lab.textContent = LAB[b.dataset.n]; });
      b.addEventListener('click', () => { rating = +b.dataset.n; paint(rating, true); lab.textContent = LAB[rating]; b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); modal.querySelector('#rvErr').textContent = ''; });
    });
    modal.querySelector('.rvm-stars').addEventListener('mouseleave', () => { paint(rating); lab.textContent = rating ? LAB[rating] : 'Touchez une étoile'; });
    modal.querySelectorAll('.rvm-skins button').forEach(b => b.addEventListener('click', () => { skin = skin === b.dataset.s ? '' : b.dataset.s; modal.querySelectorAll('.rvm-skins button').forEach(x => x.classList.toggle('on', x.dataset.s === skin)); }));
    const ta = f.text, cnt = modal.querySelector('#rvCnt');
    ta.addEventListener('input', () => { const n = ta.value.trim().length; cnt.textContent = n < 20 ? `Encore ${20 - n} caractère${20 - n > 1 ? 's' : ''}` : `${n} caractères`; cnt.classList.toggle('ok', n >= 20); });
    modal.addEventListener('click', e => { if(e.target.closest('[data-close]')) close(); });
    document.addEventListener('keydown', e => { if(e.key === 'Escape' && modal.classList.contains('on')) close(); });
    f.addEventListener('submit', async e => {
      e.preventDefault(); if(busy) return;
      const err = modal.querySelector('#rvErr'), go = f.querySelector('.rvm-go');
      const msg = !rating ? 'Choisissez une note en touchant les étoiles.' : ta.value.trim().length < 20 ? 'Racontez-nous votre expérience en quelques mots (20 caractères minimum).' : !f.name.value.trim() ? 'Indiquez votre prénom.' : !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email.value.trim()) ? 'Votre adresse e-mail semble incorrecte.' : !f.consent.checked ? 'Merci d’accepter la publication de votre avis.' : '';
      if(msg){ err.textContent = msg; return; }
      busy = true; go.disabled = true; go.textContent = 'Envoi…'; err.textContent = '';
      try {
        const r = await fetch('/api/reviews', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ productId: product.id, rating, title: f.title.value, text: ta.value, name: f.name.value, email: f.email.value, skin, consent: true, website: f.website.value }) });
        const d = await r.json().catch(() => ({}));
        if(r.ok){ modal.querySelector('#rvName').textContent = f.name.value.trim().split(' ')[0]; modal.classList.add('sent'); modal.querySelector('.rvm-p').scrollTop = 0; }
        else err.textContent = d.error === 'already' ? 'Vous avez déjà laissé un avis sur ce soin. Merci !' : d.error === 'too_many' ? 'Trop d’envois récents, réessayez dans un moment.' : 'L’envoi n’a pas abouti. Vérifiez vos informations et réessayez.';
      } catch(_) { err.textContent = 'Connexion impossible. Réessayez dans un instant.'; }
      busy = false; go.disabled = false; go.textContent = 'Publier mon avis';
    });
    return modal;
  }
  function open(){ if(!product) return; build(); modal.classList.add('on'); document.documentElement.style.overflow = 'hidden'; }
  function close(){ if(!modal) return; modal.classList.remove('on'); document.documentElement.style.overflow = ''; if(modal.classList.contains('sent')) setTimeout(() => { modal.remove(); modal = null; rating = 0; skin = ''; }, 600); }
  window.openReview = open;

  /* avis publiés */
  function decorate(){
    const sec = document.getElementById('reviews'); if(!sec || sec.dataset.rv) return; sec.dataset.rv = 1;
    const h2 = sec.querySelector('.sec-h2');
    const head = document.createElement('div'); head.className = 'rv-head'; h2.parentNode.insertBefore(head, h2); head.appendChild(sec.querySelector('.sec-eyebrow')); 
    const wrap = document.createElement('div'); wrap.appendChild(head.firstChild); wrap.appendChild(h2); h2.style.marginBottom = '0'; head.appendChild(wrap);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'rv-cta'; b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Écrire un avis'; b.addEventListener('click', open); head.appendChild(b);
    const note = document.createElement('p'); note.className = 'rv-note'; note.textContent = 'Les avis sont relus par notre équipe avant publication et publiés qu’ils soient positifs ou négatifs. « Achat vérifié » : avis déposé avec l’e-mail d’une commande de ce soin.'; sec.appendChild(note);
    const empty = sec.querySelector('.pd-noreview'); if(empty){ empty.innerHTML = 'Ce soin vient d’arriver : <a href="#" style="color:var(--accent)">soyez la première à partager votre avis</a>.'; empty.querySelector('a').addEventListener('click', e => { e.preventDefault(); open(); }); }
    if(!product.review_count){ const st0 = document.querySelector('.stars-row .stars'); if(st0) st0.textContent = '☆☆☆☆☆'; }
    const sc = document.querySelector('.stars-count'); if(sc){ sc.removeAttribute('onclick'); sc.classList.add('rv-open'); sc.addEventListener('click', () => { if(sc.dataset.count > 0) document.getElementById('reviews').scrollIntoView({ behavior:'smooth' }); else open(); }); }
  }
  function load(){
    decorate();
    fetch('/api/reviews?product=' + encodeURIComponent(product.id)).then(r => r.json()).then(d => {
      if(!d || !d.count) return;
      const sec = document.getElementById('reviews'), sum = sec.querySelector('.review-summary');
      sum.hidden = false; sum.querySelector('.review-big-num').textContent = String(d.avg).replace('.', ',');
      sum.querySelector('.review-big-num').nextElementSibling.textContent = stars(d.avg);
      sum.querySelector('.review-big-num').nextElementSibling.nextElementSibling.textContent = d.count + ' avis';
      sum.querySelector('.review-bars').innerHTML = [5,4,3,2,1].map(n => { const pc = Math.round(d.bars[n] / d.count * 100); return `<div class="rbar"><span style="width:16px">${n}★</span><div class="rbar-track"><div class="rbar-fill" style="width:${pc}%"></div></div><span>${pc}%</span></div>`; }).join('');
      const html = d.reviews.map(r => `<div class="review-card"><div class="rc-head"><span>${esc(r.name)}</span><span>${fmtDate(r.date)}</span></div><div class="rc-stars">${starsExact(r.rating)}</div>${r.title ? `<p class="rc-title">${esc(r.title)}</p>` : ''}<p class="rc-text">${esc(r.text)}</p><div class="rc-meta">${r.verified ? '<span class="ok">✓ Achat vérifié</span>' : ''}${r.skin ? `<span>Peau ${esc(r.skin.toLowerCase())}</span>` : ''}</div></div>`).join('');
      const empty = sec.querySelector('.pd-noreview'); if(empty) empty.remove();
      sec.querySelectorAll('.review-card').forEach(c => c.remove());
      sec.querySelector('.rv-note').insertAdjacentHTML('beforebegin', html);
      const sc = document.querySelector('.stars-count'); if(sc){ sc.dataset.count = d.count; sc.textContent = `${String(d.avg).replace('.', ',')} / 5 · ${d.count} avis`; }
      const st = document.querySelector('.stars-row .stars'); if(st) st.textContent = stars(d.avg);
    }).catch(() => {});
    if(location.hash === '#avis') setTimeout(open, 600);
  }
  (function wait(){ if(product && document.getElementById('reviews')) load(); else setTimeout(wait, 150); })();
})();
</script>

</body>
</html>
<script src="cart.js?v=3"></script>
